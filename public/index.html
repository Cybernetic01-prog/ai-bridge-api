<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bridge Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-indigo-400">AI Bridge Vault</h1>
                <p class="text-slate-400 text-sm">Production-ready vector memory gateway</p>
            </div>
            <!-- API Key Bar -->
            <div class="flex items-center gap-2 w-full md:w-auto">
                <input type="password" id="apiKeyInput" placeholder="Enter Bearer API Key (sk_live_...)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 w-full md:w-80 font-mono">
                <button onclick="saveApiKey()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Save</button>
            </div>
        </header>

        <!-- Register New Key Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg">
            <h2 class="text-lg font-semibold text-slate-200 mb-2">Need an API Key?</h2>
            <p class="text-sm text-slate-400 mb-4">Register your email to instantly provision a new live API key and user ID.</p>
            <div class="flex gap-2">
                <input type="email" id="regEmail" placeholder="user@example.com" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 flex-1">
                <button onclick="registerKey()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Register Key</button>
            </div>
            <div id="regOutput" class="mt-3 hidden text-xs font-mono bg-slate-950 p-3 rounded border border-slate-800 text-emerald-400"></div>
        </div>

        <!-- Main Grid: Store & Search -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Store Memory Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold text-slate-200 mb-2">Store Memory</h2>
                    <p class="text-sm text-slate-400 mb-4">Encrypt and embed text into your vector vault.</p>
                    <textarea id="memoryText" rows="4" placeholder="Write something memorable..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                </div>
                <button onclick="storeMemory()" class="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-sm font-medium transition">Encrypt & Save</button>
            </div>

            <!-- Search Memory Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold text-slate-200 mb-2">Semantic Search</h2>
                    <p class="text-sm text-slate-400 mb-4">Query your vector database by meaning.</p>
                    <input type="text" id="searchQuery" placeholder="Search concept..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 mb-3">
                </div>
                <button onclick="searchMemories()" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 py-2 rounded-lg text-sm font-medium border border-slate-700 transition">Search Vault</button>
            </div>

        </div>

        <!-- Results Section -->
        <div id="resultsContainer" class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg hidden">
            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Search Results</h3>
            <div id="resultsList" class="space-y-3"></div>
        </div>

    </div>

    <script>
        // Load saved API key on startup
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('ai_bridge_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
        });

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('ai_bridge_key', key);
                alert('API Key saved locally!');
            }
        }

        async function registerKey() {
            const email = document.getElementById('regEmail').value.trim();
            const output = document.getElementById('regOutput');
            if (!email) return alert('Please enter an email address');

            try {
                const res = await fetch('/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                output.classList.remove('hidden');
                if (res.ok) {
                    output.innerHTML = `Success! API Key: <b>${data.api_key}</b><br>User ID: ${data.user_id}`;
                    document.getElementById('apiKeyInput').value = data.api_key;
                    localStorage.setItem('ai_bridge_key', data.api_key);
                } else {
                    output.innerHTML = `Error: ${data.error}`;
                }
            } catch (err) {
                alert('Request failed: ' + err.message);
            }
        }

        async function storeMemory() {
            const key = document.getElementById('apiKeyInput').value.trim();
            const text = document.getElementById('memoryText').value.trim();
            if (!key) return alert('Please provide your API key first');
            if (!text) return alert('Please enter memory text');

            try {
                const res = await fetch('/v1/memory/add', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Memory saved successfully! ID: ' + data.memory_id);
                    document.getElementById('memoryText').value = '';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Request failed: ' + err.message);
            }
        }

        async function searchMemories() {
            const key = document.getElementById('apiKeyInput').value.trim();
            const query = document.getElementById('searchQuery').value.trim();
            if (!key) return alert('Please provide your API key first');
            if (!query) return alert('Please enter a search query');

            try {
                const res = await fetch('/v1/memory/search', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({ query, limit: 3 })
                });
                const data = await res.json();
                const container = document.getElementById('resultsContainer');
                const list = document.getElementById('resultsList');
                
                container.classList.remove('hidden');
                list.innerHTML = '';

                if (res.ok && data.memories.length > 0) {
                    data.memories.forEach(m => {
                        const score = (m.score * 100).toFixed(1);
                        list.innerHTML += `
                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-lg">
                                <p class="text-slate-200 text-sm mb-2">${m.text}</p>
                                <div class="flex justify-between text-xs text-slate-500 font-mono">
                                    <span>Similarity: ${score}%</span>
                                    <span>ID: ${m.id}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML = '<p class="text-slate-400 text-sm">No matching memories found.</p>';
                }
            } catch (err) {
                alert('Request failed: ' + err.message);
            }
        }
    </script>
</body>
</html>
