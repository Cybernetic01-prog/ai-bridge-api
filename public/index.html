<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Bridge — Vector Memory Gateway</title>
  
  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              900: '#312e81',
            },
            surface: {
              base: '#0B0F17',
              card: '#111827',
              border: '#1F2937',
              input: '#1A2233',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0B0F17; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    /* Custom Scrollbar for JSON Terminal */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

  <!-- Top Navbar -->
  <header class="border-b border-surface-border bg-surface-card/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="h-8 w-8 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold font-mono text-sm">
          ⚡
        </div>
        <div>
          <h1 class="font-bold text-slate-100 text-base tracking-tight">AI Bridge</h1>
          <p class="text-xs text-slate-400">Cross-Platform Vector Memory Layer</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
          Live Service
        </span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Panel: Controls & Input Tabs (7 cols) -->
    <div class="lg:col-span-7 space-y-6">
      
      <!-- API Key Setup Card -->
      <div class="p-5 rounded-xl bg-surface-card border border-surface-border shadow-sm">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Bearer Token Authorization</label>
        <div class="flex space-x-2">
          <input type="password" id="authKey" value="sk_live_testkey123" placeholder="Enter API Key" 
            class="flex-1 px-3 py-2 bg-surface-input border border-surface-border rounded-lg text-sm text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">
          <button onclick="toggleKeyVisibility()" class="px-3 py-2 text-xs font-medium bg-surface-border hover:bg-slate-700 rounded-lg text-slate-300 transition">
            Show
          </button>
        </div>
      </div>

      <!-- Main Interactive Box -->
      <div class="rounded-xl bg-surface-card border border-surface-border overflow-hidden shadow-md">
        
        <!-- Tab Headers -->
        <div class="flex border-b border-surface-border bg-slate-900/40 p-1">
          <button id="tab-search-btn" onclick="switchTab('search')" class="flex-1 py-2.5 text-xs font-semibold rounded-lg text-indigo-400 bg-surface-card transition">
            🔍 Recall Memory (Search)
          </button>
          <button id="tab-store-btn" onclick="switchTab('store')" class="flex-1 py-2.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition">
            💾 Store New Memory
          </button>
        </div>

        <!-- Search Tab Content -->
        <div id="tab-search" class="p-6 space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Semantic Query</label>
            <input type="text" id="searchQuery" placeholder="e.g. What do I love?" 
              class="w-full px-4 py-2.5 bg-surface-input border border-surface-border rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Result Limit</label>
            <input type="number" id="searchLimit" value="3" min="1" max="10" 
              class="w-24 px-3 py-2 bg-surface-input border border-surface-border rounded-lg text-sm text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">
          </div>
          <button onclick="executeSearch()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-lg shadow-lg shadow-indigo-600/20 transition flex items-center justify-center space-x-2">
            <span>Query Vector Database</span>
          </button>
        </div>

        <!-- Store Tab Content -->
        <div id="tab-store" class="p-6 space-y-4 hidden">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Memory Content</label>
            <textarea id="storeText" rows="3" placeholder="e.g. i love server.js" 
              class="w-full px-4 py-2.5 bg-surface-input border border-surface-border rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Optional Metadata (JSON)</label>
            <input type="text" id="storeMetadata" placeholder='e.g. {"source": "mobile_dashboard"}' 
              class="w-full px-4 py-2.5 bg-surface-input border border-surface-border rounded-lg text-sm text-slate-100 font-mono placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">
          </div>
          <button onclick="executeStore()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm rounded-lg shadow-lg shadow-emerald-600/20 transition flex items-center justify-center space-x-2">
            <span>Save Memory Vector</span>
          </button>
        </div>

      </div>

    </div>

    <!-- Right Panel: Live Response Terminal Console (5 cols) -->
    <div class="lg:col-span-5 flex flex-col h-full">
      <div class="rounded-xl bg-surface-card border border-surface-border flex-1 flex flex-col overflow-hidden shadow-md min-h-[420px]">
        
        <!-- Terminal Header -->
        <div class="px-4 py-3 bg-slate-900 border-b border-surface-border flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-rose-500/80 inline-block"></span>
            <span class="w-3 h-3 rounded-full bg-amber-500/80 inline-block"></span>
            <span class="w-3 h-3 rounded-full bg-emerald-500/80 inline-block"></span>
            <span class="ml-2 text-xs font-mono text-slate-400">response.json</span>
          </div>
          <button onclick="clearConsole()" class="text-xs font-mono text-slate-400 hover:text-slate-200 transition">Clear</button>
        </div>

        <!-- Terminal Output Area -->
        <div class="p-4 flex-1 bg-[#090D14] font-mono text-xs overflow-auto">
          <pre id="consoleOutput" class="text-emerald-400 leading-relaxed whitespace-pre-wrap">{
  "status": "idle",
  "message": "Awaiting system action..."
}</pre>
        </div>

      </div>
    </div>

  </main>

  <script>
    function switchTab(tab) {
      const searchTab = document.getElementById('tab-search');
      const storeTab = document.getElementById('tab-store');
      const searchBtn = document.getElementById('tab-search-btn');
      const storeBtn = document.getElementById('tab-store-btn');

      if (tab === 'search') {
        searchTab.classList.remove('hidden');
        storeTab.classList.add('hidden');
        searchBtn.className = 'flex-1 py-2.5 text-xs font-semibold rounded-lg text-indigo-400 bg-surface-card transition';
        storeBtn.className = 'flex-1 py-2.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition';
      } else {
        storeTab.classList.remove('hidden');
        searchTab.classList.add('hidden');
        storeBtn.className = 'flex-1 py-2.5 text-xs font-semibold rounded-lg text-emerald-400 bg-surface-card transition';
        searchBtn.className = 'flex-1 py-2.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition';
      }
    }

    function toggleKeyVisibility() {
      const input = document.getElementById('authKey');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function logOutput(data, isError = false) {
      const output = document.getElementById('consoleOutput');
      output.className = isError ? 'text-rose-400 leading-relaxed whitespace-pre-wrap' : 'text-emerald-400 leading-relaxed whitespace-pre-wrap';
      output.textContent = JSON.stringify(data, null, 2);
    }

    function clearConsole() {
      logOutput({ status: "idle", message: "Console cleared" });
    }

    async function executeSearch() {
      const query = document.getElementById('searchQuery').value.trim();
      const limit = parseInt(document.getElementById('searchLimit').value) || 3;
      const key = document.getElementById('authKey').value;

      if (!query) {
        logOutput({ error: "Please enter a search query." }, true);
        return;
      }

      logOutput({ status: "processing", message: "Executing semantic vector search..." });

      try {
        const res = await fetch('/v1/memory/search', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${key}`
          },
          body: JSON.stringify({ query, limit })
        });
        const data = await res.json();
        logOutput(data, !res.ok);
      } catch (err) {
        logOutput({ error: err.message }, true);
      }
    }

    async function executeStore() {
      const text = document.getElementById('storeText').value.trim();
      const metadataStr = document.getElementById('storeMetadata').value.trim();
      const key = document.getElementById('authKey').value;

      if (!text) {
        logOutput({ error: "Please enter memory content to store." }, true);
        return;
      }

      let metadata = {};
      if (metadataStr) {
        try {
          metadata = JSON.parse(metadataStr);
        } catch (e) {
          logOutput({ error: "Invalid JSON format in metadata field." }, true);
          return;
        }
      }

      logOutput({ status: "processing", message: "Generating embeddings & storing to Supabase..." });

      try {
        const res = await fetch('/v1/memory/store', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${key}`
          },
          body: JSON.stringify({ text, metadata })
        });
        const data = await res.json();
        logOutput(data, !res.ok);
      } catch (err) {
        logOutput({ error: err.message }, true);
      }
    }
  </script>
</body>
</html>
